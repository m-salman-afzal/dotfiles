[tools]
node = "26"
bun = "1"
pnpm = "12"
rust = { version = "stable", components = ["clippy", "rustfmt", "rust-src"] }
"npm:vercel" = "latest"
"npm:@vscode/vsce" = "latest"
"npm:npm-check-updates" = "latest"
"npm:agent-browser" = "latest"
"npm:agent-desktop" = "latest"
"npm:next-devtools-mcp" = "latest"
"npm:chrome-devtools-mcp" = "1.11.0"
oh-my-posh = "latest"
gh = "latest"
rclone = "latest"
fastfetch = "latest"
"aqua:neovim/neovim" = "latest"
dust = "latest"
btop = "latest"
betterleaks = "latest"
shellcheck = "latest"
shfmt = "latest"
tmux = "latest"
codex = "latest"
copilot = "latest"
opencode = "latest"
grok = "latest"
pi = "latest"
antigravity-cli = "latest"
dekit = "latest"
rust-analyzer = "latest"
claude = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
activate_shims = true
minimum_release_age_excludes = ["claude"]

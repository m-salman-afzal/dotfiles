[tools]
node = "26"
bun = "1"
pnpm = "12"
rust = { version = "stable", components = ["clippy", "rustfmt", "rust-src"] }
"npm:vercel" = "latest"
"npm:@vscode/vsce" = "latest"
"npm:npm-check-updates" = "latest"
"npm:agent-browser" = "latest"
"npm:next-devtools-mcp" = "latest"
"npm:chrome-devtools-mcp" = "1.11.0"
oh-my-posh = "latest"
mprocs = "latest"
gh = "latest"
rclone = "latest"
fastfetch = "latest"
"aqua:neovim/neovim" = "latest"
dust = "latest"
usage = { version = "latest", workflow = "publish-cli.yml" }
btop = "latest"
betterleaks = "latest"
shellcheck = "latest"
shfmt = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
activate_shims = true
